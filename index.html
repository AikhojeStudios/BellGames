<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8FD8F2">
<meta name="description" content="Play & Learn: money, counting and number games for young kids.">
<title>Play &amp; Learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- background: sky, drifting clouds and hills -->
<div class="scenery" aria-hidden="true">
  <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>
  <svg class="hills" viewBox="0 0 400 120" preserveAspectRatio="none">
    <path d="M0 70 C70 30 140 40 200 64 S330 96 400 52 V120 H0Z" fill="#BFEBD0"/>
    <path d="M0 96 C80 66 150 78 230 92 S350 104 400 84 V120 H0Z" fill="#A4E2BD"/>
  </svg>
</div>

<main id="app">
  <!-- HOME -->
  <section class="screen active" id="hub" aria-label="Pick a game">
    <header class="hubbar">
      <div class="totalstars" aria-label="All your stars"><span>⭐</span><b id="totalStars">0</b></div>
      <button class="iconbtn" type="button" data-action="mute" aria-label="Turn sound off">🔊</button>
    </header>
    <div class="hubhead">
      <div class="sun" aria-hidden="true"></div>
      <h1>Play <span>&amp;</span> Learn</h1>
      <p>Pick a game to play!</p>
    </div>
    <div class="tiles" id="tiles"></div>
  </section>

  <!-- LEVEL PICKER -->
  <section class="screen" id="levels" aria-label="Choose a level">
    <div class="subhead">
      <button class="iconbtn" type="button" data-action="home" aria-label="Back to games">←</button>
      <div><div class="eyebrow" id="levelsTitle">Game</div><div class="name">Choose a level</div></div>
    </div>
    <div class="modecards" id="levelCards"></div>
  </section>

  <!-- Each game's screen is built by js/app.js from the game's definition. -->
</main>

<div class="burst" id="burst" aria-hidden="true"></div>
<div class="cheer" id="cheer" aria-hidden="true"></div>

<script src="js/core.js"></script>
<script src="js/games/monier.js"></script>
<script src="js/games/path.js"></script>
<script src="js/games/feed.js"></script>
<script src="js/games/chase.js"></script>
<script src="js/app.js"></script>
</body>
</html>
